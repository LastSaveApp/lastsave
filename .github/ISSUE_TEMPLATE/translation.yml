name: Translation
description: A wrong or awkward text in a language, a text that does not fit, or a new language you want to start.
title: "[Translation] "
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: Its name or code, e.g. Español (es), Português (pt-BR).
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is it about?
      options:
        - A text is wrong or sounds awkward
        - A text does not fit (cut, or on too many lines)
        - The English itself is wrong
        - I want to start a new language
        - Something else
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where in the app?
      description: The screen, and the text as it appears. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What should it say?
      description: Your suggestion, and why if it is not obvious.
