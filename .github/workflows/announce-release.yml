# Posts to #announcements when a release is published.
#
# **This workflow lives in the PUBLIC repository, and it has to.** The source and every other
# workflow live in the private `LastSaveApp/lastsave-app`, but a `release` event fires in the
# repository the release belongs to — this one — and GitHub does not deliver it across repositories.
#
# `released` rather than `published` or `created`: it fires when a release stops being a draft,
# which is the moment a human decided the build was good. A draft must never announce itself.
#
# Needs one secret on THIS repository: DISCORD_ANNOUNCE_WEBHOOK, a webhook created in the
# #announcements channel. A webhook rather than the bot token because it can only post to the one
# channel it was made for — the blast radius of a leak is a single channel, not the whole server.
name: Announce release

on:
  release:
    types: [released]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      # What KIND of release this is, read from the two version numbers rather than declared
      # anywhere. The previous release is the newest published one that is not this one, so an
      # un-published draft never counts as the predecessor.
      #
      # The label is the semver field that moved, which is also the vocabulary CHANGELOG.md uses:
      # patch for fixes, minor for a large or disruptive change, major for the author's own call.
      # Before 1.0 that means "minor" is the biggest label a release will normally carry, and that
      # is correct rather than a shortcoming - it is what the version number is saying.
      - name: Work out the kind of release
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          current=${TAG#v}
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.draft == false and .prerelease == false and .tag_name != \"${TAG}\")][0].tag_name // empty")
          previous=${previous#v}

          # Field by field with parameter expansion. A heredoc would work but has to sit at column
          # zero inside a YAML block scalar, which is a trap for whoever edits this next.
          if [ -z "$previous" ]; then
            kind="first release"; color=3889883
          elif [ "${current%%.*}" != "${previous%%.*}" ]; then
            kind=major; color=14721051
          else
            cmi=${current#*.}; cmi=${cmi%%.*}
            pmi=${previous#*.}; pmi=${pmi%%.*}
            if [ "$cmi" != "$pmi" ]; then
              kind=minor; color=3889883
            else
              kind=patch; color=3908445
            fi
          fi

          echo "previous=${previous:-none} current=$current kind=$kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
          KIND: ${{ steps.kind.outputs.kind }}
          COLOR: ${{ steps.kind.outputs.color }}
        run: |
          set -e
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_ANNOUNCE_WEBHOOK is not set on this repository."
            exit 1
          fi

          # Discord caps an embed description at 4096 characters. Long notes are trimmed with a
          # pointer to the full page rather than silently rejected by the API.
          description=$(printf '%s' "$NOTES" | head -c 3800)
          if [ "${#NOTES}" -gt 3800 ]; then
            description="$description"$'\n\n'"[Read the full notes]($URL)"
          fi

          # jq builds the JSON so that quotes, newlines and backticks in the notes cannot break it.
          jq -n \
            --arg title "LastSave $TAG - $KIND" \
            --arg url "$URL" \
            --arg description "$description" \
            --argjson color "$COLOR" \
            '{
              content: "A new version of LastSave is out.",
              embeds: [{
                title: $title,
                url: $url,
                description: $description,
                color: $color
              }]
            }' > payload.json

          code=$(curl -s -o response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d @payload.json "$WEBHOOK")
          echo "Discord responded $code"
          # 204 is the webhook's success. Anything else should fail the run rather than be a green
          # tick on an announcement nobody received.
          [ "$code" = "204" ] || { cat response.txt; exit 1; }
